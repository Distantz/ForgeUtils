name: "Build Content Pack Documentation"
description: "Builds Lua documentation into a MDBook, optionally uploading as an artifact."

inputs:
  upload_pages:
    description: "Whether pages should be uploaded."
    required: false

runs:
  using: "composite"
  steps:
    - name: Setup mdBook
      uses: peaceiris/actions-mdbook@v2
      with:
        mdbook-version: "latest"

    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Setup luals_docs_gen
      shell: bash
      env:
        # Pin to a specific commit so the build is reproducible.
        # Replace with the latest commit SHA from
        # https://github.com/emuell/luals-docs-gen/commits/master
        LUALS_DOCS_GEN_REV: "e5ea526285eaeb1c25f86b0336cbb0eaae0c5a7e"
      run: |
        cargo install \
          --git https://github.com/emuell/luals-docs-gen \
          --rev "${LUALS_DOCS_GEN_REV}" \
          --root "$HOME/.local"

        # Make the binary available to later steps
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

        # Verify the binary exists
        ls -l "$HOME/.local/bin"

    - name: Generate Markdown with luals-docs-gen
      shell: bash
      run: |
        LUA_SOURCE_PATH="${{ github.workspace }}/Main"
        DOCS_OUTPUT_BASE_PATH="${{ github.workspace }}/Docs/src"

        find "${LUA_SOURCE_PATH}" -type d

        # Run luals-docs-gen for our code
        luals_docs_gen -o by-class -n "forgeutils" "${LUA_SOURCE_PATH}" "${DOCS_OUTPUT_BASE_PATH}"

        cat "${DOCS_OUTPUT_BASE_PATH}/SUMMARY.md"

    - name: Build mdbook documentation
      shell: bash
      run: |
        cd "${{ github.workspace }}/Docs"
        mdbook build

    - name: Check mdbook output
      shell: bash
      run: |
        echo "Contents of Docs after build:"
        ls -l "${{ github.workspace }}/Docs"
        echo "Contents of book dir (if exists):"
        ls -l "${{ github.workspace }}/Docs/book" || echo "No book directory found"

    - name: Upload mdBook output as artifact
      if: ${{ inputs.upload_pages != '' }}
      id: upload-pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: ${{ github.workspace }}/Docs/book
